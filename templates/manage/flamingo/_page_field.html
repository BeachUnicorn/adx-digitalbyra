{% comment %}Ett fält på landningssidan, med sitt skäl. multiline ger en textarea.{% endcomment %}
<fieldset class="mf-group{% if group.changed or group.reason_error %} is-changed{% endif %}" data-review-group="{{ key }}">
    <legend class="m-sr-only">{{ group.label }}</legend>
    <div class="m-field">
        <label for="f-{{ key }}">{{ label }}</label>
        {% if multiline %}<textarea id="f-{{ key }}" name="{{ key }}" rows="3" spellcheck="true">{{ value }}</textarea>{% else %}<input id="f-{{ key }}" name="{{ key }}" value="{{ value }}" autocomplete="off" spellcheck="true">{% endif %}
        {% if error %}<div class="m-field-error">{{ error }}</div>{% endif %}
    </div>
    {% include "manage/flamingo/_reason.html" %}
</fieldset>
