{% extends "portal/base.html" %}
{% block content %}
<section class="hero narrow"><div class="kicker">[ Lösenord ]</div><h2>Nytt lösenord</h2>
<p class="lead" style="margin-top:12px">Skriv din e-post så mejlar vi en länk där du väljer ett nytt lösenord.</p>
<form method="post" class="adx-form compact panel" style="margin-top:28px">{% csrf_token %}
  <div class="field full"><label for="id_email">E-post</label><input type="email" name="email" id="id_email" required autofocus></div>
  <div class="form-actions"><button type="submit" class="btn">Skicka länk</button><a href="{% url 'portal:login' %}" class="form-note">Tillbaka</a></div>
</form></section>
{% endblock %}
