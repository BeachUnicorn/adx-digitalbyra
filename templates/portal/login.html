{% extends "portal/base.html" %}
{% block content %}
<div class="pt-center">
  <form class="m-panel pt-login" method="post" action="{% url 'portal:login' %}">
    {% csrf_token %}
    <h1 class="m-login__title">Logga in</h1>
    <p class="m-login__subtitle">Kundportal</p>
    <p class="pt-lead">Skriv din e-postadress så mejlar vi en engångskod. Inget lösenord att komma ihåg.</p>
    <div class="m-field">
      <label for="id_email">E-post</label>
      <input type="email" name="email" id="id_email" autocomplete="email" required autofocus placeholder="namn@foretag.se">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="m-btn">Skicka kod</button>
  </form>
</div>
{% endblock %}
