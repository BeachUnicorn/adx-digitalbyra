# sites.d/adx.conf - PER-SITE config. One file = one site = one git repo =
# one systemd service = one nginx vhost = one Postgres database.
#
# Tracked in git on purpose: it contains NO secrets. The DB password lives in
# the project-level .env (DATABASE_URL), which is gitignored. Keeping this file
# in the repo means a fresh clone / re-provision recreates it automatically.

# Short slug. Drives service name, socket name, paths, logs, Sentry env.
SITE_SLUG="adx"

# Git source for THIS site.
GIT_REPO_URL="git@github.com:BeachUnicorn/adx-digitalbyra.git"
GIT_BRANCH="main"

# Django settings module for this site.
DJANGO_SETTINGS_MODULE="config.settings.production"

# Let's Encrypt certificate name. Kept STABLE for the life of the site - it is
# the folder under /etc/letsencrypt/live/<CERT_NAME>/ and the certbot
# --cert-name. nginx points at this path, so DOMAINS can change (beta -> live)
# WITHOUT touching the cert path.
CERT_NAME="adx.se"

# Domains for this site. The FIRST entry is the canonical/primary domain that
# everything else redirects to; the rest are aliases on the same certificate.
#
# adx.se är primär; www.adx.se redirectas dit (beslut 2026-08-29).
DOMAINS=("adx.se" "www.adx.se")

# Länkvärdarna för utskick (apps/utskick, README C.5, E.1): korta länkar i
# sms (k.adx.se) och i mejl (klick.adx.se). Inte i DOMAINS: varje domän där
# 301:as till adx.se. Egen certifikatlinje (LINK_CERT_NAME), så att ett
# misslyckat HTTP-01 på en länkvärd aldrig stoppar förnyelsen av adx.se.
# lib.sh ritar ett eget serverblock (LINK_BLOCK): port 80 till https, och 443
# först när /etc/letsencrypt/live/<LINK_CERT_NAME>/ finns (certs.sh).
# Ingen access-logg där (koderna i adresserna är behörigheter), inget /media/,
# och MCP och OAuth svarar 404.
LINK_DOMAINS=("k.adx.se" "klick.adx.se")
LINK_CERT_NAME="adx-links"

# Postgres database for this site.
DB_NAME="adx_digitalbyra"

# Per-site DB role (overrides the project.conf default). Must match the role
# and password in the project-level .env DATABASE_URL.
DB_USER="adx_dbuser"

# ASGI, inte WSGI: MCP-endpointen (/mcp/ + OAuth-routningen) finns bara i
# config.asgi-routern. Ren WSGI ger en fungerande sajt men dödar MCP tyst -
# det var exakt vad som hände 2026-08-22. uvicorn dras in av mcp-beroendet.
GUNICORN_WORKER_CLASS="uvicorn.workers.UvicornWorker"
APP_MODULE="config.asgi:application"

# Boxen är en t3.small (2 GB RAM) som delas med sju andra sajter; två
# uvicorn-workers räcker för lanseringstrafiken och håller minnet i schack.
GUNICORN_WORKERS="2"
