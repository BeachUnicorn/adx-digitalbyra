# project.conf - REPO-LEVEL config, shared by every site in this checkout.
#
# Tracked in git on purpose: it holds only machine-wide defaults and NO secrets.
# Real secrets (SECRET_KEY, DB password via DATABASE_URL) live in each site's
# project-level .env, which is gitignored. Keeping this file in the repo means a
# fresh clone / re-provision recreates it automatically.
#
# Everything site-specific (git repo, domains, DB name) lives in
# sites.d/<site>.conf.

# Linux system user that owns and runs the sites.
SYSTEM_USER="djangouser"

# Where all sites for this repo live on disk.
BASE_DIR="/home/${SYSTEM_USER}/sites"

# Postgres defaults. Each site overrides DB_USER + DB_NAME in its own
# sites.d/<site>.conf; these are only fallbacks.
DB_USER="adx_dbuser"
DB_HOST="localhost"
DB_PORT="5432"

# Gunicorn worker tuning (applied to every site unless overridden per site).
GUNICORN_WORKERS="3"
GUNICORN_THREADS="2"
